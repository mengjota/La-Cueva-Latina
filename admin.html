<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — La Cueva Latina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fuego:        #e8521a;
      --ambar:        #f0841a;
      --ambar-claro:  #ffaa4c;
      --dorado:       #c9a84c;
      --crema:        #f5ead8;
      --fondo-carbon: #0e0602;
      --fondo-oscuro: #1a0a02;
      --fondo-medio:  #2d1008;
      --fondo-tarjeta:#221008;
      --texto-suave:  #c4a882;
      --verde:        #2ecc71;
      --rojo:         #e74c3c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--fondo-carbon);
      color: var(--crema);
      min-height: 100vh;
    }

    /* ── PANTALLA DE LOGIN ── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(232,82,26,0.08) 0%, transparent 70%),
        var(--fondo-carbon);
    }

    .login-card {
      background: var(--fondo-tarjeta);
      border: 1px solid rgba(240,132,26,0.25);
      border-radius: 6px;
      padding: 50px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 60px rgba(232,82,26,0.1);
    }

    .login-card .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--ambar);
      margin-bottom: 6px;
      text-shadow: 0 0 20px rgba(240,132,26,0.4);
    }

    .login-card .subtitulo {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--texto-suave);
      margin-bottom: 36px;
    }

    .login-card input {
      width: 100%;
      background: rgba(45,16,8,0.8);
      border: 1px solid rgba(240,132,26,0.2);
      color: var(--crema);
      padding: 14px 18px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      border-radius: 4px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.3s;
      text-align: center;
      letter-spacing: 3px;
    }

    .login-card input:focus {
      border-color: var(--ambar);
      box-shadow: 0 0 15px rgba(240,132,26,0.15);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--fuego), var(--ambar));
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(232,82,26,0.4);
    }

    .btn-login:hover {
      box-shadow: 0 0 35px rgba(232,82,26,0.7);
      transform: translateY(-2px);
    }

    .error-msg {
      color: var(--rojo);
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }

    /* ── PANEL ADMIN ── */
    #admin-panel { display: none; }

    .admin-header {
      background: rgba(14,6,2,0.98);
      border-bottom: 1px solid rgba(240,132,26,0.25);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 30px rgba(232,82,26,0.1);
    }

    .admin-header .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--ambar);
    }

    .admin-header .badge {
      font-size: 0.75rem;
      background: rgba(240,132,26,0.15);
      border: 1px solid rgba(240,132,26,0.3);
      color: var(--ambar-claro);
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-left: 12px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-refrescar {
      background: rgba(240,132,26,0.1);
      border: 1px solid rgba(240,132,26,0.3);
      color: var(--ambar);
      padding: 8px 18px;
      border-radius: 4px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Lato', sans-serif;
    }

    .btn-refrescar:hover {
      background: rgba(240,132,26,0.2);
      box-shadow: 0 0 12px rgba(240,132,26,0.3);
    }

    .btn-salir {
      background: rgba(231,76,60,0.1);
      border: 1px solid rgba(231,76,60,0.3);
      color: #e74c3c;
      padding: 8px 18px;
      border-radius: 4px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Lato', sans-serif;
    }

    .btn-salir:hover { background: rgba(231,76,60,0.2); }

    .admin-body { padding: 40px; max-width: 1300px; margin: 0 auto; }

    /* ── ESTADÍSTICAS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--fondo-tarjeta);
      border: 1px solid rgba(240,132,26,0.15);
      border-radius: 6px;
      padding: 24px;
      text-align: center;
      transition: border-color 0.3s;
    }

    .stat-card:hover { border-color: rgba(240,132,26,0.35); }

    .stat-numero {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: var(--ambar);
      text-shadow: 0 0 15px rgba(240,132,26,0.4);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--texto-suave);
      margin-top: 8px;
    }

    /* ── TABLA DE RESERVACIONES ── */
    .tabla-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .tabla-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--crema);
    }

    .tabla-wrapper {
      background: var(--fondo-tarjeta);
      border: 1px solid rgba(240,132,26,0.15);
      border-radius: 6px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: rgba(45,16,8,0.9);
      border-bottom: 1px solid rgba(240,132,26,0.2);
    }

    thead th {
      padding: 14px 20px;
      text-align: left;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ambar);
      font-weight: 700;
    }

    tbody tr {
      border-bottom: 1px solid rgba(240,132,26,0.08);
      transition: background 0.2s;
    }

    tbody tr:last-child { border-bottom: none; }

    tbody tr:hover { background: rgba(45,16,8,0.5); }

    tbody td {
      padding: 16px 20px;
      font-size: 0.9rem;
      color: var(--crema);
      vertical-align: top;
    }

    .td-fecha {
      color: var(--ambar);
      font-weight: 700;
      white-space: nowrap;
    }

    .td-hora {
      color: var(--ambar-claro);
      white-space: nowrap;
    }

    .td-personas {
      text-align: center;
    }

    .personas-badge {
      background: rgba(240,132,26,0.15);
      border: 1px solid rgba(240,132,26,0.3);
      color: var(--ambar-claro);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    .td-mensaje {
      color: var(--texto-suave);
      font-size: 0.85rem;
      max-width: 250px;
    }

    .td-creado {
      color: var(--texto-suave);
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* ── TABS ── */
    .tab-btn {
      background: rgba(45,16,8,0.5);
      border: 1px solid rgba(240,132,26,0.15);
      color: var(--texto-suave);
      padding: 10px 24px;
      border-radius: 4px;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.activo {
      background: rgba(240,132,26,0.12);
      border-color: var(--ambar);
      color: var(--ambar);
      box-shadow: 0 0 15px rgba(240,132,26,0.15);
    }
    .tab-btn:hover:not(.activo) {
      border-color: rgba(240,132,26,0.3);
      color: var(--crema);
    }

    /* ── VACÍO / CARGANDO ── */
    .estado-tabla {
      text-align: center;
      padding: 60px 20px;
      color: var(--texto-suave);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .estado-tabla .icono { font-size: 2.5rem; margin-bottom: 16px; }
  </style>
</head>
<body>

  <!-- ── PANTALLA DE LOGIN ── -->
  <div id="login-screen">
    <div class="login-card">
      <div class="logo">La Cueva Latina</div>
      <div class="subtitulo">Panel de Administración</div>

      <input
        type="password"
        id="input-password"
        placeholder="Contraseña"
        onkeydown="if(event.key==='Enter') iniciarSesion()"
      />
      <button class="btn-login" onclick="iniciarSesion()">Entrar</button>
      <div class="error-msg" id="error-msg">Contraseña incorrecta</div>
    </div>
  </div>

  <!-- ── PANEL DE ADMIN ── -->
  <div id="admin-panel">

    <div class="admin-header">
      <div>
        <span class="logo">La Cueva Latina</span>
        <span class="badge">ADMIN</span>
      </div>
      <div class="header-right">
        <button class="btn-refrescar" onclick="cargarTodo()">↻ Actualizar</button>
        <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>

    <div class="admin-body">

      <!-- Estadísticas -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-numero" id="stat-total">—</div>
          <div class="stat-label">Total Reservaciones</div>
        </div>
        <div class="stat-card">
          <div class="stat-numero" id="stat-hoy">—</div>
          <div class="stat-label">Reservas Hoy</div>
        </div>
        <div class="stat-card">
          <div class="stat-numero" id="stat-pedidos">—</div>
          <div class="stat-label">Pedidos Hoy</div>
        </div>
        <div class="stat-card">
          <div class="stat-numero" id="stat-ingresos">—</div>
          <div class="stat-label">Ingresos Hoy</div>
        </div>
      </div>

      <!-- TABS -->
      <div style="display:flex; gap:4px; margin-bottom:24px;">
        <button class="tab-btn activo" id="tab-reservaciones" onclick="cambiarTab('reservaciones')">📅 Reservaciones</button>
        <button class="tab-btn" id="tab-pedidos" onclick="cambiarTab('pedidos')">🍽️ Pedidos</button>
      </div>

      <!-- Tabla Reservaciones -->
      <div id="seccion-reservaciones">
        <div class="tabla-wrapper">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Personas</th>
                <th>Mensaje</th>
                <th>Registrado</th>
              </tr>
            </thead>
            <tbody id="tabla-reservaciones"></tbody>
          </table>
        </div>
      </div>

      <!-- Tabla Pedidos -->
      <div id="seccion-pedidos" style="display:none;">
        <div class="tabla-wrapper">
          <table>
            <thead>
              <tr>
                <th>#Pedido</th>
                <th>Cliente</th>
                <th>Tipo</th>
                <th>Items</th>
                <th>Total</th>
                <th>Notas</th>
                <th>Hora</th>
              </tr>
            </thead>
            <tbody id="tabla-pedidos"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── CONFIGURACIÓN ──
    const SUPABASE_URL = 'https://ltxjmnzqyznuexhrmznt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_YX3Ivtgp3km23oeW391E2A_AAFRZCEV';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Contraseña del admin — cámbiala cuando quieras
    const PASSWORD_ADMIN = 'lacueva2024';

    // ── LOGIN ──
    function iniciarSesion() {
      const input = document.getElementById('input-password').value;
      const errorMsg = document.getElementById('error-msg');

      if (input === PASSWORD_ADMIN) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display  = 'block';
        cargarReservaciones();
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('input-password').value = '';
        setTimeout(() => { errorMsg.style.display = 'none'; }, 3000);
      }
    }

    function cerrarSesion() {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('admin-panel').style.display  = 'none';
      document.getElementById('input-password').value = '';
    }

    function cambiarTab(tab) {
      document.getElementById('seccion-reservaciones').style.display = tab === 'reservaciones' ? 'block' : 'none';
      document.getElementById('seccion-pedidos').style.display       = tab === 'pedidos'       ? 'block' : 'none';
      document.getElementById('tab-reservaciones').classList.toggle('activo', tab === 'reservaciones');
      document.getElementById('tab-pedidos').classList.toggle('activo', tab === 'pedidos');
    }

    function cargarTodo() {
      cargarReservaciones();
      cargarPedidos();
    }

    // ── RESERVACIONES ──
    async function cargarReservaciones() {
      const tbody = document.getElementById('tabla-reservaciones');
      tbody.innerHTML = `<tr><td colspan="7"><div class="estado-tabla"><div class="icono">⏳</div>Cargando...</div></td></tr>`;

      const { data, error } = await db.from('reservaciones').select('*').order('fecha').order('hora');
      if (error) { tbody.innerHTML = `<tr><td colspan="7"><div class="estado-tabla"><div class="icono">❌</div>Error al cargar.</div></td></tr>`; return; }

      actualizarEstadisticas(data);

      if (!data.length) { tbody.innerHTML = `<tr><td colspan="7"><div class="estado-tabla"><div class="icono">📋</div>No hay reservaciones.</div></td></tr>`; return; }

      const hoy = new Date().toISOString().split('T')[0];
      tbody.innerHTML = data.map(r => {
        const fecha  = new Date(r.fecha + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        const creado = new Date(r.created_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        const esHoy  = r.fecha === hoy;
        return `<tr style="${esHoy ? 'background:rgba(240,132,26,0.06)' : ''}">
          <td><strong>${r.nombre}</strong>${esHoy ? ' <span style="color:var(--ambar);font-size:0.7rem">●HOY</span>' : ''}</td>
          <td>${r.telefono || '—'}</td>
          <td class="td-fecha">${fecha}</td>
          <td class="td-hora">${r.hora}</td>
          <td><span class="personas-badge">${r.personas} 👥</span></td>
          <td class="td-mensaje">${r.mensaje || '—'}</td>
          <td class="td-creado">${creado}</td>
        </tr>`;
      }).join('');
    }

    // ── PEDIDOS ──
    async function cargarPedidos() {
      const tbody = document.getElementById('tabla-pedidos');
      tbody.innerHTML = `<tr><td colspan="7"><div class="estado-tabla"><div class="icono">⏳</div>Cargando...</div></td></tr>`;

      const { data, error } = await db.from('pedidos').select('*').order('created_at', { ascending: false });
      if (error) { tbody.innerHTML = `<tr><td colspan="7"><div class="estado-tabla"><div class="icono">❌</div>Error al cargar.</div></td></tr>`; return; }

      actualizarStatsPedidos(data);

      if (!data.length) { tbody.innerHTML = `<tr><td colspan="7"><div class="estado-tabla"><div class="icono">🍽️</div>No hay pedidos todavía.</div></td></tr>`; return; }

      tbody.innerHTML = data.map(p => {
        const hora  = new Date(p.created_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        const items = Array.isArray(p.items) ? p.items.map(i => `${i.emoji} ${i.nombre} x${i.cantidad}`).join('<br>') : '—';
        const tipo  = p.tipo === 'mesa' ? `🍽️ Mesa ${p.numero_mesa || ''}` : '🥡 Para llevar';
        return `<tr>
          <td><strong style="color:var(--ambar)">${p.numero_pedido}</strong></td>
          <td>${p.cliente_nombre}<br><span style="color:var(--texto-suave);font-size:0.8rem">${p.cliente_telefono || ''}</span></td>
          <td>${tipo}</td>
          <td style="font-size:0.82rem;color:var(--texto-suave)">${items}</td>
          <td style="color:var(--ambar);font-weight:700">$${Number(p.total).toFixed(2)}</td>
          <td class="td-mensaje">${p.notas || '—'}</td>
          <td class="td-creado">${hora}</td>
        </tr>`;
      }).join('');
    }

    // ── ESTADÍSTICAS ──
    function actualizarEstadisticas(data) {
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('stat-total').textContent = data.length;
      document.getElementById('stat-hoy').textContent   = data.filter(r => r.fecha === hoy).length;
    }

    function actualizarStatsPedidos(data) {
      const hoy        = new Date().toDateString();
      const pedidosHoy = data.filter(p => new Date(p.created_at).toDateString() === hoy);
      const ingresos   = pedidosHoy.reduce((s, p) => s + Number(p.total), 0);
      document.getElementById('stat-pedidos').textContent  = pedidosHoy.length;
      document.getElementById('stat-ingresos').textContent = '$' + ingresos.toFixed(0);
    }
  </script>

</body>
</html>
